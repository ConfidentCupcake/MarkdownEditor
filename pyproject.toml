[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confident-cupcake-markdown-editor"
version = "1.9.2"
description = "A PyQt Markdown and Python editor"
requires-python = ">=3.11"
dependencies = [
    "bleach>=6.2,<7",
    "jedi>=0.19,<1",
    "Markdown>=3.7,<4",
    "packaging>=24,<27",
    "PyQt5>=5.15,<6",
    "PyQtWebEngine>=5.15,<6",
    "QScintilla>=2.14,<3",
    "ruff>=0.12,<1",
]

[project.gui-scripts]
markdown-editor = "main:main"

[tool.setuptools]
py-modules = ["main", "resources_rc", "title_bar"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "code_inteligence*",
    "code_settings*",
    "con_term*",
    "cozy*",
    "markdown_editor*",
    "python_editor*",
    "ruff_implementation*",
    "side_bar_widgets*",
    "markdowneditor_assets*",
]

[tool.setuptools.package-data]
markdowneditor_assets = [
    "css/*.qss",
    "icons/*.png",
    "icons/*.svg",
    "icons/*.qrc",
    "icons/cat/*.png",
    "icons/cat_sheets/*.png",
    "themes/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["resources_rc.py", "build", "dist", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F403", "F405"]
"resources_rc.py" = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "code_inteligence",
    "code_settings",
    "con_term",
    "cozy",
    "markdown_editor",
    "python_editor",
    "ruff_implementation",
    "side_bar_widgets",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true