[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["resources_rc.py", "build", "dist", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F403", "F405"]
"resources_rc.py" = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "code_inteligence",
    "code_settings",
    "con_term",
    "cozy",
    "markdown_editor",
    "python_editor",
    "ruff_implementation",
    "side_bar_widgets",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
