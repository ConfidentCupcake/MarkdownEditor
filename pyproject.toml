[tool.ruff]
target-version = "py311" # Parse source using Python 3.11 semantics.
line-length = 100 # Preferred width for formatter and relevant lint rules.
extend-exclude = ["resources_rc.py", "build", "dist", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort, UP = pyupgrade,
# B = bugbear, SIM = simplify, C4 = comprehensions, RUF = Ruff rules.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"] # Ruff formatter, not diagnostics, controls line wrapping.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F403", "F405"] # Existing Qt wildcard imports are intentional.
"resources_rc.py" = ["ALL"] # Generated Qt resource module.

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["autocompleter", "console_widget", "custompythonlexer", "definition_finder", "file_manager", "find_replace", "fuzzy_searcher", "hover_helper", "markdowneditor", "multi_tab_view", "python_runner", "pythoneditor", "ruff_service", "ruff_diagnostics_model", "ruff_diagnostics_worker", "ruff_diagnostics_view", "ruff_diagnostics_controller", "terminal_widget"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true